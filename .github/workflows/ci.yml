name: CI (optional)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Fase 2/Evidencias Proyecto/appSmart/requirements/development.txt"
      - name: Run linters
        run: |
          black --check .
          isort --check-only .
          flake8
      - name: Run tests
        run: |
          pytest -q
